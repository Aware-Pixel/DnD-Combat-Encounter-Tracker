<style>
  :root{
    --bg: #1c1712; --bg-panel: #262019; --bg-card: #2e2620; --line: #4a3d2e;
    --gold: #c9a227; --gold-dim: #8a6c14; --maroon: #8b2635; --maroon-dim: #5c1a24;
    --cream: #ede6d6; --cream-dim: #b8ad97; --ally: #4a9c78; --ally-dim: #2e6b52;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body{ margin:0; background: var(--bg); color: var(--cream); font-family:'Inter',system-ui,sans-serif; min-height:100vh; padding-bottom: 50px; }
  header{ padding: 18px 16px 12px; text-align:center; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg,#241d16,#1c1712); position: sticky; top:0; z-index: 30; }
  header .crown{ display:block; margin:0 auto 6px; width:26px; height:26px; }
  h1{ font-family:'Cinzel',serif; font-weight:700; font-size:1.2rem; margin:0; color:var(--gold); letter-spacing:.5px; }
  header p{ margin:3px 0 0; font-size:.72rem; color:var(--cream-dim); font-style:italic; }

  .bar{ display:flex; gap:8px; overflow-x:auto; padding: 10px 12px 4px; scrollbar-width:none; }
  .bar::-webkit-scrollbar{ display:none; }
  .session-bar{ position: sticky; top: 76px; z-index: 29; background: var(--bg); border-bottom:1px solid var(--line); }
  .subtab-bar{ position: sticky; top: 130px; z-index: 28; background: var(--bg); padding-top:8px; }

  .pill{ flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg-panel); color:var(--cream-dim); font-size:.75rem; font-weight:600; white-space:nowrap; cursor:pointer; }
  .pill.active{ background:var(--maroon); border-color:var(--maroon); color:var(--cream); }
  .pill.sub.active{ background: var(--gold-dim); border-color: var(--gold-dim); color:#1c1712; }
  .pill.add{ background:transparent; border:1px dashed var(--line); color:var(--cream-dim); }

  .session-manage{ display:flex; align-items:center; gap:8px; padding: 8px 14px 0; max-width:640px; margin:0 auto; }
  .session-manage input{ flex:1; background:transparent; border:none; border-bottom:1px solid transparent;
    color: var(--gold); font-family:'Cinzel',serif; font-size:1.05rem; font-weight:600; padding:2px 0; }
  .session-manage input:focus{ outline:none; border-bottom-color: var(--gold-dim); }
  .icon-btn{ background:none; border:1px solid var(--line); color:var(--cream-dim); border-radius:8px;
    padding:5px 9px; font-size:.72rem; cursor:pointer; white-space:nowrap; }
  .icon-btn.danger{ border-color: var(--maroon-dim); color:#d99; }

  main{ max-width:640px; margin:0 auto; padding: 10px 14px 0; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin:10px 2px 12px; gap:8px; }
  .toolbar h2{ font-family:'Cinzel',serif; font-size:.92rem; color:var(--cream-dim); margin:0; font-weight:600; }
  .toolbar-btns{ display:flex; gap:6px; }
  .small-btn{ background:none; border:1px solid var(--line); color:var(--cream-dim); padding:5px 9px;
    border-radius:8px; font-size:.68rem; cursor:pointer; }

  .card{ background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:12px 14px 14px; margin-bottom:12px; transition:opacity .3s; }
  .card.downed{ opacity:.45; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .name-wrap{ flex:1; min-width:0; }
  .name{ font-family:'Cinzel',serif; font-size:.98rem; font-weight:600; color:var(--cream); background:transparent; border:none; width:100%; padding:0; }
  .name:focus{ outline:none; border-bottom:1px solid var(--gold-dim); }
  .badge-row{ display:flex; align-items:center; gap:6px; margin-top:3px; flex-wrap:wrap; }
  .type-badge{ font-size:.63rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; padding:1px 6px; border-radius:5px; }
  .type-badge.enemy{ color:#e8b3bd; background: rgba(139,38,53,.35); }
  .type-badge.ally{ color:#bfe8d3; background: rgba(74,156,120,.3); }
  .note-text{ font-size:.68rem; color:var(--cream-dim); font-style:italic; }
  .card-actions{ display:flex; gap:4px; flex-shrink:0; }
  .mini-btn{ background:none; border:none; color:var(--cream-dim); font-size:.95rem; cursor:pointer; padding:2px 5px; line-height:1; }

  .hp-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .hp-bar-wrap{ flex:1; height:16px; border-radius:8px; background:#14100c; border:1px solid var(--line); position:relative; overflow:hidden; }
  .hp-fill{ height:100%; border-radius:8px 0 0 8px; transition:width .35s ease, background .35s ease; }
  .hp-tick{ position:absolute; top:0; bottom:0; width:1px; background:rgba(0,0,0,.35); }
  .hp-text{ font-size:.76rem; font-weight:600; color:var(--cream-dim); min-width:60px; text-align:right; font-variant-numeric:tabular-nums; }

  .controls{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .dmg-btn{ border:1px solid var(--maroon-dim); background:var(--maroon-dim); color:var(--cream); border-radius:8px; padding:7px 11px; font-size:.76rem; font-weight:600; cursor:pointer; }
  .heal-btn{ border-color:var(--ally-dim); background:transparent; color:var(--ally); }
  .num-input{ width:50px; text-align:center; background:var(--bg-panel); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:7px 4px; font-size:.78rem; }
  .apply-btn{ border:1px solid var(--gold-dim); background:transparent; color:var(--gold); border-radius:8px; padding:7px 12px; font-size:.76rem; font-weight:700; cursor:pointer; }

  .add-panel{ background: var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin: 6px 0 20px; }
  .add-panel-title{ font-size:.72rem; color:var(--cream-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
  .type-toggle{ display:flex; gap:6px; margin-bottom:8px; }
  .type-toggle button{ flex:1; padding:7px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--cream-dim); font-size:.75rem; font-weight:600; cursor:pointer; }
  .type-toggle button.sel[data-type="enemy"]{ background: var(--maroon-dim); border-color:var(--maroon-dim); color:var(--cream); }
  .type-toggle button.sel[data-type="ally"]{ background: var(--ally-dim); border-color:var(--ally-dim); color:var(--cream); }
  .add-form{ display:flex; gap:8px; flex-wrap:wrap; }
  .add-form input{ background:var(--bg-card); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:9px 10px; font-size:.8rem; }
  .add-form input[name="ename"]{ flex:1 1 120px; }
  .add-form input[name="enote"]{ flex:1 1 100px; }
  .add-form input[name="ehp"]{ width:64px; }
  .add-btn{ background:var(--gold-dim); border:none; color:#1c1712; font-weight:700; border-radius:8px; padding:9px 16px; font-size:.8rem; cursor:pointer; width:100%; margin-top:8px; }

  .empty{ text-align:center; color:var(--cream-dim); font-style:italic; padding:26px 10px; font-size:.85rem; }
  .status{ text-align:center; font-size:.7rem; color:var(--cream-dim); padding:10px 0 0; min-height:14px; }
  .footer-actions{ display:flex; justify-content:center; gap:10px; padding: 18px 0 6px; }
  .footer-actions button{ background:none; border:1px solid var(--line); color:var(--cream-dim); padding:8px 14px; border-radius:8px; font-size:.72rem; cursor:pointer; }
  #importFile{ display:none; }
</style>
</head>
<body>

<header>
  <svg class="crown" viewBox="0 0 24 24" fill="none"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z" stroke="#c9a227" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <h1>DM Combat Tracker</h1>
  <p>Sessions → Party & Encounters → Combatants</p>
</header>

<div class="bar session-bar" id="sessionBar"></div>
<div class="session-manage" id="sessionManage"></div>
<div class="bar subtab-bar" id="subtabBar"></div>

<main>
  <div class="toolbar">
    <h2 id="listTitle"></h2>
    <div class="toolbar-btns" id="toolbarBtns"></div>
  </div>
  <div id="cardList"></div>
  <div class="add-panel">
    <div class="add-panel-title">Add combatant</div>
    <div class="type-toggle" id="typeToggle">
      <button class="sel enemy" data-type="enemy">Enemy</button>
      <button data-type="ally">Ally</button>
    </div>
    <div class="add-form">
      <input type="text" name="ename" id="newName" placeholder="Name">
      <input type="text" name="enote" id="newNote" placeholder="Note (optional)">
      <input type="number" name="ehp" id="newHp" placeholder="Max HP" min="1">
    </div>
    <button class="add-btn" id="addBtn">Add</button>
  </div>
  <div class="status" id="statusLine"></div>
  <div class="footer-actions">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
</main>

<script>
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaultGraciousKing(){
  const mk = (name, type, note, maxHp) => ({ id: uid(), name, type, note, maxHp, currentHp: maxHp });
  const enc = (name, list) => ({ id: uid(), name, combatants: list });
  return {
    id: uid(), name: "The Gracious King", activeTab: "party",
    party: [],
    encounters: [
      enc("5.1 Vaultmarket", [
        mk("Vaultwarden Sera","enemy","Elite",78),
        mk("Warden A","enemy","Minion",33), mk("Warden B","enemy","Minion",33),
        mk("Skirmisher A","enemy","Minion",22), mk("Skirmisher B","enemy","Minion",22), mk("Skirmisher C","enemy","Minion",22),
        mk("Husk Skirmisher A","enemy","Husk — arrives later",18), mk("Husk Skirmisher B","enemy","Husk — arrives later",18),
      ]),
      enc("5.2 Root Hollow", [
        mk("Grovemother Yssa","enemy","Elite",90),
        mk("Skirmisher A","enemy","Minion",22), mk("Skirmisher B","enemy","Minion",22),
        mk("Warden A","enemy","Minion",33), mk("Warden B","enemy","Minion",33),
        mk("Husk Elder","enemy","Husk — arrives later",55),
      ]),
      enc("5.3 Forgeworks", [
        mk("Forge Marshal Brenn","enemy","Elite",95),
        mk("Warden A","enemy","Minion",33), mk("Warden B","enemy","Minion",33),
        mk("Warden C","enemy","Minion",33), mk("Warden D","enemy","Minion",33),
        mk("Husk Warden A","enemy","Husk — arrives later",28), mk("Husk Warden B","enemy","Husk — arrives later",28),
      ]),
      enc("5.4 Elderwood Canopy", [
        mk("Elder Strider Faelan","enemy","Elite",82),
        mk("Skirmisher A","enemy","Minion",22), mk("Skirmisher B","enemy","Minion",22), mk("Skirmisher C","enemy","Minion",22),
        mk("Husk Skirmisher A","enemy","Husk — arrives later",18), mk("Husk Skirmisher B","enemy","Husk — arrives later",18),
      ]),
      enc("5.5 Twin Banner Garrison", [
        mk("Champion Korrin","enemy","Elite",100),
        mk("Warden A","enemy","Minion",33), mk("Warden B","enemy","Minion",33),
        mk("Warden C","enemy","Minion",33), mk("Warden D","enemy","Minion",33),
        mk("Husk Warden A","enemy","Husk — arrives later",28), mk("Husk Warden B","enemy","Husk — arrives later",28),
      ]),
      enc("5.6 Hush Archive", [
        mk("Archivist Thessaly","enemy","Elite",85),
        mk("Adept A","enemy","Minion",40), mk("Adept B","enemy","Minion",40), mk("Adept C","enemy","Minion",40),
        mk("Husk Skirmisher A","enemy","Husk — arrives later",18), mk("Husk Skirmisher B","enemy","Husk — arrives later",18),
      ]),
      enc("7.0 Throne Room", [
        mk("Malvorric, the Hollow Crown","enemy","Boss",180),
        mk("King Vaelith","ally","",45), mk("Queen Borga","ally","",45),
      ]),
    ],
  };
}

const STORAGE_KEY = "dnd-combat-tracker-v1";
let state = null;

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) { setStatus("Storage unavailable — changes won't be saved this session."); }
  const gk = defaultGraciousKing();
  return { sessions: [gk], activeSessionId: gk.id };
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { setStatus("Couldn't save — your device may be low on storage."); }
}
function setStatus(msg){
  const el = document.getElementById("statusLine");
  el.textContent = msg || "";
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2500);
}

function activeSession(){ return state.sessions.find(s => s.id === state.activeSessionId); }
function activeList(session){
  if (session.activeTab === "party") return session.party;
  const enc = session.encounters.find(e => e.id === session.activeTab);
  return enc ? enc.combatants : session.party;
}
function activeEncounter(session){
  if (session.activeTab === "party") return null;
  return session.encounters.find(e => e.id === session.activeTab);
}

function renderAll(){
  renderSessionBar();
  renderSessionManage();
  renderSubtabBar();
  renderList();
}

function renderSessionBar(){
  const wrap = document.getElementById("sessionBar");
  wrap.innerHTML = "";
  state.sessions.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "pill" + (s.id === state.activeSessionId ? " active" : "");
    btn.textContent = s.name;
    btn.onclick = () => { state.activeSessionId = s.id; saveState(); renderAll(); };
    wrap.appendChild(btn);
  });
  const add = document.createElement("button");
  add.className = "pill add";
  add.textContent = "+ New session";
  add.onclick = () => {
    const name = prompt("Name this session (e.g. a campaign or game name):");
    if (!name) return;
    const s = { id: uid(), name: name.trim(), activeTab: "party", party: [], encounters: [] };
    state.sessions.push(s);
    state.activeSessionId = s.id;
    saveState(); renderAll();
  };
  wrap.appendChild(add);
}

function renderSessionManage(){
  const wrap = document.getElementById("sessionManage");
  const s = activeSession();
  wrap.innerHTML = "";
  const input = document.createElement("input");
  input.value = s.name;
  input.onchange = () => { s.name = input.value.trim() || s.name; saveState(); renderSessionBar(); };
  wrap.appendChild(input);
  const del = document.createElement("button");
  del.className = "icon-btn danger";
  del.textContent = "Delete session";
  del.onclick = () => {
    if (state.sessions.length === 1){ setStatus("You need at least one session."); return; }
    if (!confirm('Delete session "' + s.name + '" and everything in it? This cannot be undone.')) return;
    state.sessions = state.sessions.filter(x => x.id !== s.id);
    state.activeSessionId = state.sessions[0].id;
    saveState(); renderAll();
  };
  wrap.appendChild(del);
}

function renderSubtabBar(){
  const wrap = document.getElementById("subtabBar");
  const s = activeSession();
  wrap.innerHTML = "";
  const partyBtn = document.createElement("button");
  partyBtn.className = "pill sub" + (s.activeTab === "party" ? " active" : "");
  partyBtn.textContent = "Party";
  partyBtn.onclick = () => { s.activeTab = "party"; saveState(); renderSubtabBar(); renderList(); };
  wrap.appendChild(partyBtn);
  s.encounters.forEach(enc => {
    const btn = document.createElement("button");
    btn.className = "pill sub" + (s.activeTab === enc.id ? " active" : "");
    btn.textContent = enc.name;
    btn.onclick = () => { s.activeTab = enc.id; saveState(); renderSubtabBar(); renderList(); };
    wrap.appendChild(btn);
  });
  const add = document.createElement("button");
  add.className = "pill add";
  add.textContent = "+ Encounter";
  add.onclick = () => {
    const name = prompt("Name this encounter:");
    if (!name) return;
    const enc = { id: uid(), name: name.trim(), combatants: [] };
    s.encounters.push(enc);
    s.activeTab = enc.id;
    saveState(); renderSubtabBar(); renderList();
  };
  wrap.appendChild(add);
}

function hpColor(pct){
  if (pct > 0.5) return "linear-gradient(90deg,#c9a227,#a3831c)";
  if (pct > 0.2) return "linear-gradient(90deg,#b5772f,#8f5a1f)";
  return "linear-gradient(90deg,#a3324a,#7a2138)";
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderList(){
  const s = activeSession();
  const enc = activeEncounter(s);
  const isParty = s.activeTab === "party";
  document.getElementById("listTitle").textContent = isParty ? "Party" : enc.name;

  const toolbarBtns = document.getElementById("toolbarBtns");
  toolbarBtns.innerHTML = "";
  const healAllBtn = document.createElement("button");
  healAllBtn.className = "small-btn";
  healAllBtn.textContent = "Heal all";
  healAllBtn.onclick = () => {
    activeList(s).forEach(c => c.currentHp = c.maxHp);
    saveState(); renderList();
  };
  toolbarBtns.appendChild(healAllBtn);
  if (!isParty){
    const clearBtn = document.createElement("button");
    clearBtn.className = "small-btn";
    clearBtn.textContent = "Clear all";
    clearBtn.onclick = () => {
      if (!confirm("Remove every combatant from this encounter?")) return;
      enc.combatants = [];
      saveState(); renderList();
    };
    toolbarBtns.appendChild(clearBtn);
    const delEncBtn = document.createElement("button");
    delEncBtn.className = "small-btn";
    delEncBtn.textContent = "Delete encounter";
    delEncBtn.onclick = () => {
      if (!confirm('Delete encounter "' + enc.name + '"?')) return;
      s.encounters = s.encounters.filter(e => e.id !== enc.id);
      s.activeTab = "party";
      saveState(); renderSubtabBar(); renderList();
    };
    toolbarBtns.appendChild(delEncBtn);
  }

  const list = activeList(s);
  const wrap = document.getElementById("cardList");
  wrap.innerHTML = "";
  if (list.length === 0){
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = isParty ? "No party members yet — add your characters below." : "No combatants yet — add some below.";
    wrap.appendChild(d);
    return;
  }
  list.forEach(entry => {
    const pct = Math.max(0, entry.currentHp / entry.maxHp);
    const card = document.createElement("div");
    card.className = "card" + (entry.currentHp <= 0 ? " downed" : "");
    card.innerHTML = `
      <div class="card-top">
        <div class="name-wrap">
          <input class="name" value="${escapeHtml(entry.name)}" data-id="${entry.id}" data-field="name">
          <div class="badge-row">
            <span class="type-badge ${entry.type}">${entry.type === "ally" ? "Ally" : "Enemy"}</span>
            ${entry.note ? `<span class="note-text">${escapeHtml(entry.note)}</span>` : ""}
          </div>
        </div>
        <div class="card-actions">
          <button class="mini-btn" data-id="${entry.id}" data-action="dup" title="Duplicate">⧉</button>
          <button class="mini-btn" data-id="${entry.id}" data-action="remove" title="Remove">✕</button>
        </div>
      </div>
      <div class="hp-row">
        <div class="hp-bar-wrap">
          <div class="hp-fill" style="width:${Math.min(100, pct*100)}%; background:${hpColor(pct)}"></div>
          <div class="hp-tick" style="left:25%"></div><div class="hp-tick" style="left:50%"></div><div class="hp-tick" style="left:75%"></div>
        </div>
        <div class="hp-text">${entry.currentHp} / ${entry.maxHp}</div>
      </div>
      <div class="controls">
        <button class="dmg-btn" data-id="${entry.id}" data-action="dmg1">-1</button>
        <button class="dmg-btn" data-id="${entry.id}" data-action="dmg5">-5</button>
        <button class="dmg-btn" data-id="${entry.id}" data-action="dmg10">-10</button>
        <input class="num-input" type="number" id="dmg-input-${entry.id}" placeholder="0">
        <button class="apply-btn" data-id="${entry.id}" data-action="applydmg">Apply</button>
        <button class="dmg-btn heal-btn" data-id="${entry.id}" data-action="heal5">+5</button>
      </div>
    `;
    wrap.appendChild(card);
  });
}

document.getElementById("cardList").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const s = activeSession();
  const list = activeList(s);
  const id = btn.dataset.id;
  const entry = list.find(x => x.id === id);
  if (!entry) return;
  const action = btn.dataset.action;
  if (action === "remove"){
    const idx = list.indexOf(entry); list.splice(idx,1);
  } else if (action === "dup"){
    list.push({ id: uid(), name: entry.name + " (copy)", type: entry.type, note: entry.note, maxHp: entry.maxHp, currentHp: entry.maxHp });
  } else if (action === "dmg1"){ entry.currentHp = Math.max(0, entry.currentHp - 1); }
  else if (action === "dmg5"){ entry.currentHp = Math.max(0, entry.currentHp - 5); }
  else if (action === "dmg10"){ entry.currentHp = Math.max(0, entry.currentHp - 10); }
  else if (action === "heal5"){ entry.currentHp = Math.min(entry.maxHp, entry.currentHp + 5); }
  else if (action === "applydmg"){
    const input = document.getElementById("dmg-input-" + id);
    const val = parseInt(input.value);
    if (!isNaN(val)){ entry.currentHp = Math.max(0, Math.min(entry.maxHp, entry.currentHp - val)); input.value = ""; }
  }
  saveState(); renderList();
});

document.getElementById("cardList").addEventListener("change", (e) => {
  if (e.target.dataset.field === "name"){
    const s = activeSession();
    const entry = activeList(s).find(x => x.id === e.target.dataset.id);
    if (entry){ entry.name = e.target.value || entry.name; saveState(); }
  }
});

let selectedType = "enemy";
document.getElementById("typeToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  selectedType = btn.dataset.type;
  document.querySelectorAll("#typeToggle button").forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
});

document.getElementById("addBtn").addEventListener("click", () => {
  const s = activeSession();
  const list = activeList(s);
  const nameInput = document.getElementById("newName");
  const noteInput = document.getElementById("newNote");
  const hpInput = document.getElementById("newHp");
  const name = nameInput.value.trim();
  const note = noteInput.value.trim();
  const hp = parseInt(hpInput.value);
  if (!name || isNaN(hp) || hp <= 0){ setStatus("Enter a name and a max HP above 0."); return; }
  list.push({ id: uid(), name, type: selectedType, note, maxHp: hp, currentHp: hp });
  nameInput.value = ""; noteInput.value = ""; hpInput.value = "";
  saveState(); renderList();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "dm-combat-tracker-backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus("Backup downloaded.");
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.sessions || !Array.isArray(parsed.sessions)) throw new Error("bad format");
      if (!confirm("Import this backup? It will replace everything currently in the tracker.")) return;
      state = parsed;
      saveState(); renderAll();
      setStatus("Backup imported.");
    } catch(err){ setStatus("That file doesn't look like a valid backup."); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

state = loadState();
renderAll();
</script>
</body>
